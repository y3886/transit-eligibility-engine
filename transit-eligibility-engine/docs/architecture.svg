<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <style>
    .box { fill:#ffffff; stroke:#2b6cb0; stroke-width:2 } 
    .title { font: bold 16px sans-serif; fill:#0b3b5c }
    .label { font: 12px sans-serif; fill:#07304a }
    .arrow { stroke:#2b6cb0; stroke-width:2; marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <!-- ETL -->
  <rect x="30" y="20" width="220" height="100" rx="8" class="box"/>
  <text x="45" y="45" class="title">ETL - src/etl.py</text>
  <text x="45" y="70" class="label">Read CBS Excel → Normalize → Master</text>

  <!-- Normalizer -->
  <rect x="300" y="20" width="200" height="80" rx="8" class="box"/>
  <text x="320" y="45" class="title">Normalizer</text>
  <text x="320" y="70" class="label">normalize_hebrew()</text>

  <!-- Index -->
  <rect x="560" y="20" width="260" height="120" rx="8" class="box"/>
  <text x="580" y="45" class="title">LocalityIndex - src/matcher.py</text>
  <text x="580" y="70" class="label">Exact-first + RapidFuzz fallback</text>

  <!-- Engine -->
  <rect x="300" y="140" width="200" height="80" rx="8" class="box"/>
  <text x="320" y="165" class="title">Eligibility Engine</text>
  <text x="320" y="190" class="label">explain_eligibility()</text>

  <!-- API -->
  <rect x="560" y="160" width="260" height="100" rx="8" class="box"/>
  <text x="580" y="185" class="title">API / UI - src/app.py</text>
  <text x="580" y="210" class="label">/resolve, /api/v1/eligibility/check</text>

  <!-- arrows -->
  <line x1="250" y1="70" x2="300" y2="70" class="arrow"/>
  <line x1="500" y1="70" x2="560" y2="70" class="arrow"/>
  <line x1="640" y1="120" x2="640" y2="140" class="arrow"/>
  <line x1="500" y1="180" x2="560" y2="180" class="arrow"/>

  <!-- DB / Output -->
  <rect x="30" y="160" width="220" height="100" rx="8" class="box"/>
  <text x="45" y="185" class="title">Data / Outputs</text>
  <text x="45" y="210" class="label">data/processed/master_localities.*</text>

  <line x1="140" y1="120" x2="140" y2="160" class="arrow"/>

  <!-- legend -->
  <text x="30" y="300" class="label">Flow: Excel → Normalizer → Index → API → UI</text>

</svg>
